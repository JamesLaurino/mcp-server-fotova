spring.application.name=fotova-creation-mcp-dev
server.port=8082

####### MYSQL DATABASE CONNEXION ######
spring.datasource.url=jdbc:mysql://${SERVER_HOST}:3306/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

##### MCP CONFIG #######
spring.ai.mcp.server.name=mcp-fotova
spring.ai.mcp.server.type=async
spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/sse/message
spring.ai.mcp.server.version=1.0.0


logging.level.io.modelcontextprotocol=TRACE
logging.level.org.springframework.ai.mcp=TRACE
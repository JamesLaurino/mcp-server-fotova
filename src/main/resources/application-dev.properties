spring.application.name=fotova-creation-mcp-dev
server.port=8082

####### MYSQL DATABASE CONNEXION ######
spring.datasource.url=jdbc:mysql://${SERVER_HOST}:3306/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

##### MCP CONFIG #######
spring.ai.mcp.server.name=mcp-fotova
spring.ai.mcp.server.type=async
spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/sse/message
spring.ai.mcp.server.version=1.0.0


logging.level.io.modelcontextprotocol=TRACE
logging.level.org.springframework.ai.mcp=TRACE

##### MAIL CONFIG #######
spring.mail.host=${MAIL_HOG_HOST}
spring.mail.port=1025
spring.mail.username=${MAIL_HOG_USERNAME}
spring.mail.password=${MAIL_HOG_PASSWORD}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
###### RABBIT MQ CONFIG ######
spring.rabbitmq.host=${RABBIT_HOST}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USERNAME}
spring.rabbitmq.password=${RABBIT_PASSWORD}

app.env.host=${SERVER_HOST}
app.env.protocol=${SERVER_PROTOCOL}
app.env.sender.email=${SENDER_EMAIL}